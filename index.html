<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大桐桃園-新車美容鍍膜預約系統</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif}
header{background:#111827;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:19px}.nav{display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:700}.primary{background:#2563eb;color:#fff}.light{background:#fff;color:#111827}.outline{background:transparent;border:1px solid #64748b;color:#fff}
main{max-width:1500px;margin:auto;padding:24px}.hero{background:#111827;color:#fff;border-radius:18px;padding:24px;margin-bottom:16px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px #0000000d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{font-size:29px;font-weight:850}.muted{color:#6b7280;font-size:14px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e5e7eb;white-space:nowrap;text-align:left}.table th{background:#f9fafb}.badge{border-radius:99px;padding:4px 8px;font-size:12px;font-weight:800}.p1{background:#fee2e2;color:#b91c1c}.p2{background:#fef3c7;color:#92400e}.p3{background:#dbeafe;color:#1d4ed8}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit}.full{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:18px}.notice{padding:10px;border-radius:9px;background:#ecfdf5;color:#166534;margin-bottom:12px}.err{background:#fef2f2;color:#991b1b}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:#fff;min-height:120px;border-radius:8px;padding:7px}.event{font-size:12px;background:#dbeafe;border-radius:5px;padding:5px;margin-top:4px;cursor:pointer}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;padding:22px;max-width:650px;width:100%}
.sync{font-size:13px;padding:6px 9px;border-radius:99px;background:#dcfce7;color:#166534}.offline{background:#fee2e2;color:#991b1b}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.calendar{grid-template-columns:1fr}.day{min-height:auto}}
</style>

<style>
.calendar-wrap{margin-top:18px;border:1px solid #e5e7eb;border-radius:14px;padding:16px;background:#fff}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.calendar-head button{padding:7px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer}
.calendar-title{font-size:18px;font-weight:700}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calendar-weekday{text-align:center;font-size:12px;font-weight:700;color:#6b7280;padding:6px 0}
.calendar-day{min-height:92px;border:1px solid #e5e7eb;border-radius:8px;padding:6px;background:#fff;overflow:hidden}
.calendar-day.empty{background:#f9fafb}
.calendar-day.sunday{background:#fef2f2}
.calendar-day.holiday{background:#fff7ed}
.calendar-day-num{font-size:12px;font-weight:700;margin-bottom:4px}
.calendar-item{font-size:11px;padding:3px 5px;margin:3px 0;border-radius:5px;background:#eef2ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calendar-item.coating{background:#f3e8ff}
.calendar-item.wash{background:#e0f2fe}
.calendar-note{font-size:10px;color:#991b1b;margin-top:3px}
@media(max-width:700px){
 .calendar-day{min-height:70px;padding:4px}
 .calendar-item{font-size:9px}
 .calendar-grid{gap:3px}
}
</style>
<style>.service-hints{margin-top:8px;padding:9px 12px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0;color:#475569;font-size:13px;line-height:1.7}.service-hints div::before{content:"• ";font-weight:700}.workday-hint{margin-top:7px;color:#b45309;font-size:13px;line-height:1.6;font-weight:600}</style></head>
<body>
<header><div class="brand">🚗 大桐桃園-新車美容鍍膜預約</div><div class="nav"><span id="sync" class="sync">● 雲端連線中</span><button class="btn light" onclick="page('dashboard')">工作台</button><button class="btn outline" onclick="page('calendar')">月曆</button><button class="btn primary" onclick="page('new')">＋ 新增預約</button></div></header>
<main>
<section id="dashboard"><div class="hero"><h2>美容施工工作台</h2><div>VIN 末7碼、銷售顧問、服務項目、可以施工日期為必填；其它選填。排程與月曆均以施工日為依據。所有使用者共用同一個 Supabase 雲端資料庫。</div></div><div id="msg"></div><div class="grid" id="kpi"></div><div class="card" style="margin-top:15px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>排程清單</h3><button class="btn" onclick="load()">↻ 重新整理</button><input id="search" placeholder="搜尋 VIN／業代／車型" oninput="renderTable()" style="padding:9px;border:1px solid #ddd;border-radius:8px"></div><div class="tablewrap"><table class="table"><thead><tr><th>施工日</th><th>時間</th><th>資源</th><th>服務</th><th>VIN末7碼</th><th>車型</th><th>業代</th><th>優先</th><th>狀態</th></tr></thead><tbody id="tbody"></tbody></table></div></div></section>
<section id="new" style="display:none"><div class="card"><h2>新增美容預約</h2><form id="form"><div class="formgrid">
<div class="field"><label>VIN 末7碼 *</label><input id="vin" maxlength="7" minlength="7" pattern="[A-Za-z0-9]{7}" required placeholder="例如 A123456"></div>
<div class="field"><label>車牌（選填）</label><input id="plate"></div><div class="field"><label>車型</label><input id="model"></div><div class="field"><label>車色</label><input id="color"></div>
<div class="field"><label>銷售顧問 *</label><input id="salesperson" required></div><div class="field"><label>服務項目 *</label><select id="service"><option value="wash_wax">洗車+維護劑+內裝清潔｜2小時／每日8台</option><option value="coating">全車鍍膜｜8小時／每日3台</option></select><div class="service-hints"><div>洗車 建議至少提前一天</div><div>全車鍍膜 建議至少提前兩天</div></div></div>
<div class="field">
<label>可以施工日期 *</label>
<input id="delivery" type="date" required onchange="validateWorkDateInput(this)">
<div class="workday-hint">溫馨提醒您，服務廠週日無法施工哦~</div>
<div class="workday-hint">若選擇的服務項目當日已達排程上限，系統將無法完成預約。請幫我選擇其它日期或以人工方式安排，謝謝您的配合~</div>
</div><div class="field full"><label>備註</label><textarea id="note" rows="3"></textarea></div>
</div><div class="actions"><button class="btn primary">自動排程並寫入雲端</button><button type="button" class="btn" onclick="page('dashboard')">取消</button></div></form></div></section>
<section id="calendar" style="display:none"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>施工月曆</h2><div><button class="btn" onclick="month(-1)">‹</button> <b id="monthLabel"></b> <button class="btn" onclick="month(1)">›</button></div></div><div class="calendar" id="cal"></div></div></section>
</main><div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script src="config.js"></script>

<script>function validateWorkDate(dateString){
  if(!dateString)return{ok:false,message:"請選擇可以施工日期"};
  const d=new Date(dateString+"T00:00:00");
  const key=ymdLocal(d);
  if(d.getDay()===0)return{ok:false,message:"週日無法施工，請選擇其他日期。"};
  if(window.HOLIDAYS && window.HOLIDAYS.has(key))return{ok:false,message:"該日期為服務廠休假日，請選擇其他日期。"};
  return{ok:true};
}
let calendarCursor = new Date();
calendarCursor.setDate(1);

function calendarPrev(){ calendarCursor.setMonth(calendarCursor.getMonth()-1); renderCalendar(window.__appointments||[]); }
function calendarNext(){ calendarCursor.setMonth(calendarCursor.getMonth()+1); renderCalendar(window.__appointments||[]); }

function renderCalendar(rows){
  const title=document.getElementById("calendarTitle");
  const grid=document.getElementById("calendarGrid");
  if(!title || !grid) return;
  const y=calendarCursor.getFullYear(), m=calendarCursor.getMonth();
  title.textContent=`${y}年${m+1}月`;
  const weekdays=["日","一","二","三","四","五","六"];
  grid.innerHTML=weekdays.map(x=>`<div class="calendar-weekday">${x}</div>`).join("");

  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0).getDate();
  for(let i=0;i<first.getDay();i++) grid.insertAdjacentHTML("beforeend",'<div class="calendar-day empty"></div>');

  const byDate={};
  (rows||[]).forEach(r=>{
    const d=r.work_date;
    if(!byDate[d]) byDate[d]=[];
    byDate[d].push(r);
  });

  for(let day=1;day<=last;day++){
    const d=new Date(y,m,day);
    const key=ymdLocal(d);
    const sunday=d.getDay()===0;
    const holiday=HOLIDAYS.has(key);
    let cls="calendar-day"+(sunday?" sunday":"")+(holiday?" holiday":"");
    let content=`<div class="calendar-day-num">${day}</div>`;
    if(sunday) content+=`<div class="calendar-note">週日休息</div>`;
    else if(holiday) content+=`<div class="calendar-note">休假</div>`;
    (byDate[key]||[]).forEach(r=>{
      const type=r.service==="coating"?"coating":"wash";
      const label=r.service==="coating"?"鍍膜":"洗車";
      content+=`<div class="calendar-item ${type}" title="${r.vin||""}">${label} ${r.vin||""}</div>`;
    });
    grid.insertAdjacentHTML("beforeend",`<div class="${cls}">${content}</div>`);
  }
}

/* === 行事曆與施工日期規則 === */
window.HOLIDAYS = new Set([
  "2026-01-01",
  "2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20",
  "2026-02-27","2026-02-28",
  "2026-04-03","2026-04-04","2026-04-05",
  "2026-05-01",
  "2026-06-19",
  "2026-09-25","2026-09-28",
  "2026-10-09","2026-10-10",
  "2026-10-24","2026-10-25",
  "2026-12-25"
]);
function ymdLocal(d){
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function isWorkday(d){
  // 週日固定不排程；週六可正常排程
  return d.getDay() !== 0 && !HOLIDAYS.has(ymdLocal(d));
}
function previousWorkday(dateString, count){
  const d=new Date(dateString+"T00:00:00");
  let n=count;
  while(n>0){
    d.setDate(d.getDate()-1);
    if(isWorkday(d)) n--;
  }
  return ymdLocal(d);
}
function getScheduledWorkDate(deliveryDate, service){
  // wash_wax：交車日前 1 個工作日
  // coating：交車日前 2 個工作日
  return previousWorkday(deliveryDate, service === "coating" ? 2 : 1);
}

const C=window.SUPABASE_CONFIG||{};const URL=(C.url||"").replace(/\/$/,""),KEY=C.anonKey||"";
const SERVICES={wash_wax:{name:"洗車+維護劑+內裝清潔",limit:8,resources:4,slots:[["08:30","10:30"],["10:30","12:30"],["13:00","15:00"],["15:00","17:00"]]},coating:{name:"全車鍍膜",limit:3,resources:3,slots:[["08:30","16:30"]]}};
const STATUS={scheduled:"已排程",in_progress:"施工中",qc:"QC檢查",completed:"已完工",cancelled:"取消"};let rows=[],cd=new Date();cd.setDate(1);
const headers={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"};
function configured(){return URL&&KEY}
async function load(){if(!configured()){setSync(false,"尚未設定 Supabase");rows=[];renderAll();return}try{let r=await fetch(URL+"/rest/v1/appointments?select=*&order=work_date.asc,start_time.asc",{headers:{"apikey":KEY,"Authorization":"Bearer "+KEY}});if(!r.ok)throw new Error();rows=await r.json();setSync(true);renderAll()}catch(e){setSync(false,"雲端連線失敗");notify("無法取得雲端資料，請檢查 config.js 與 Supabase。",true)}}
function setSync(ok,t){let x=document.getElementById("sync");x.textContent="● "+(t||"雲端連線中");x.className=ok?"sync":"sync offline"}
function notify(t,e=false){let x=document.getElementById("msg");x.className=e?"notice err":"notice";x.textContent=t;setTimeout(()=>x.textContent="",5000)}
function iso(d){return ymdLocal(d)}function priority(del){let n=Math.ceil((new Date(del)-new Date(new Date().toDateString()))/86400000);return n<=1?"P1":n<=3?"P2":"P3"}
function find(d,s){if(!isWorkday(d))return null;let ds=iso(d),a=rows.filter(x=>x.status!="cancelled"&&x.work_date===ds&&x.service===s);if(a.length>=SERVICES[s].limit)return null;for(let r=1;r<=SERVICES[s].resources;r++)for(let z of SERVICES[s].slots)if(!a.some(x=>x.resource_no===r&&x.start_time<z[1]&&x.end_time>z[0]))return{resource_no:r,start_time:z[0],end_time:z[1]};return null}
function recommend(workDate,s){
   // 只依使用者選定的施工日排程，不自動順延到其他日期。
   const d=new Date(workDate+"T00:00:00");
   const z=find(d,s);
   if(z)return{work_date:iso(d),...z};
   return null;
}
function page(p){["dashboard","new","calendar"].forEach(x=>document.getElementById(x).style.display=x===p?"block":"none");if(p==="dashboard")renderAll();if(p==="calendar")renderCal()}
document.getElementById("form").onsubmit=async e=>{
e.preventDefault();
try{if(!configured()){notify("尚未設定 Supabase，無法共用雲端資料。請先設定 config.js。",true);return}
let vin=document.getElementById("vin").value.trim().toUpperCase(),sp=document.getElementById("salesperson").value.trim(),workDate=document.getElementById("delivery").value,s=document.getElementById("service").value;
if(!/^[A-Z0-9]{7}$/.test(vin)||!sp||!workDate){notify("VIN 末7碼、業代名與可以施工日期皆為必填。",true);return} const dateCheck=validateWorkDate(workDate); if(!dateCheck.ok){notify(dateCheck.message,true);return}
if(rows.some(x=>x.vin===vin&&x.status!=="cancelled")){notify("此 VIN 末7碼已有預約。",true);return}
let z=recommend(workDate,s);if(!z){notify("這天已滿囉~請幫我選別其它日期",true);return}
let x={vin,plate:document.getElementById("plate").value.trim(),model:document.getElementById("model").value.trim(),color:document.getElementById("color").value.trim(),salesperson:sp,service:s,delivery_date:workDate,...z,priority:priority(workDate),status:"scheduled",note:document.getElementById("note").value.trim()};
try{let r=await fetch(URL+"/rest/v1/appointments",{method:"POST",headers:{...headers,"Prefer":"return=representation"},body:JSON.stringify(x)});if(!r.ok){let tx=await r.text();throw new Error(tx)}await load();e.target.reset();notify(`預約已寫入雲端，施工日：${x.work_date}，其他使用者重新整理即可看到。`);page("dashboard")}
catch(err){notify("寫入雲端失敗："+err.message,true)}
}catch(err){notify("排程處理發生錯誤："+(err.message||err),true);console.error(err)}};
function renderAll(){let t=iso(new Date());document.getElementById("kpi").innerHTML=Object.entries(SERVICES).map(([k,v])=>{let n=rows.filter(x=>x.status!="cancelled"&&x.work_date===t&&x.service===k).length;return `<div class="card"><div class="muted">${v.name}</div><div class="kpi">${n} / ${v.limit}</div><small>今日使用量／每日上限</small></div>`}).join("")+`<div class="card"><div class="muted">P1 高風險案件</div><div class="kpi">${rows.filter(x=>x.status!="cancelled"&&x.priority==="P1").length}</div></div>`;renderTable()}
function renderTable(){let q=(document.getElementById("search").value||"").toLowerCase(),a=rows.filter(x=>x.status!="cancelled"&&[x.vin,x.salesperson,x.model].join(" ").toLowerCase().includes(q));document.getElementById("tbody").innerHTML=a.map(x=>`<tr onclick="detail('${x.vin}')"><td>${x.work_date}</td><td>${x.start_time}–${x.end_time}</td><td>R${x.resource_no}</td><td>${SERVICES[x.service].name}</td><td><b>${x.vin}</b></td><td>${x.model||"—"}</td><td>${x.salesperson}</td><td><span class="badge ${x.priority.toLowerCase()}">${x.priority}</span></td><td>${STATUS[x.status]}</td></tr>`).join("")||`<tr><td colspan="9" style="text-align:center;padding:30px">目前沒有排程</td></tr>`}
function detail(v){let x=rows.find(a=>a.vin===v);if(!x)return;document.getElementById("modalbox").innerHTML=`<h2>${x.model||"車輛"}｜VIN末7碼 ${x.vin}</h2><p>業代：<b>${x.salesperson}</b>　車牌：${x.plate||"未填寫"}</p><p>服務：${SERVICES[x.service].name}<br>施工：${x.work_date} ${x.start_time}–${x.end_time}｜R${x.resource_no}<br>施工日：${x.work_date}<br>狀態：${STATUS[x.status]}</p><hr>${Object.entries(STATUS).filter(([k])=>k!="cancelled").map(([k,v])=>`<button class="btn primary" onclick="setStatus('${x.vin}','${k}')">${v}</button> `).join("")}<button class="btn" onclick="setStatus('${x.vin}','cancelled')">取消</button><div style="text-align:right;margin-top:15px"><button class="btn" onclick="closeModal()">關閉</button></div>`;document.getElementById("modal").classList.add("show")}
async function setStatus(v,s){try{let r=await fetch(URL+"/rest/v1/appointments?vin=eq."+encodeURIComponent(v),{method:"PATCH",headers:{...headers,"Prefer":"return=minimal"},body:JSON.stringify({status:s,updated_at:new Date().toISOString()})});if(!r.ok)throw 0;await load();closeModal()}catch(e){notify("狀態更新失敗。",true)}}
function closeModal(){document.getElementById("modal").classList.remove("show")}function month(n){cd.setMonth(cd.getMonth()+n);renderCal()}
function renderCal(){let y=cd.getFullYear(),m=cd.getMonth(),f=new Date(y,m,1),l=new Date(y,m+1,0);document.getElementById("monthLabel").textContent=`${y}年 ${m+1}月`;let h="";for(let i=0;i<f.getDay();i++)h+="<div></div>";for(let d=1;d<=l.getDate();d++){let ds=iso(new Date(y,m,d)),a=rows.filter(x=>x.status!="cancelled"&&x.work_date===ds);h+=`<div class="day"><b>${d}</b>${a.map(x=>`<div class="event" onclick="detail('${x.vin}')">${x.start_time} ${SERVICES[x.service].name}<br>${x.vin}｜${x.salesperson}</div>`).join("")}</div>`}document.getElementById("cal").innerHTML=h}
(function(){
  const dateInput=document.getElementById("delivery");
  if(dateInput)dateInput.min=ymdLocal(new Date());
})();
load();renderCal();
</script></body></html>
